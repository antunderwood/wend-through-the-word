name: Deploy
# Deploys a release to wendtheword.flying-ant.uk (decisions 152, 153, 154): the release's data
# asset, staged with the page built from the release tag, checked, deployed, then checked live.
# It starts when the release command publishes the release, after the zip is uploaded (the tag is
# pushed before, so a tag trigger could start before the zip exists). To roll back, run it by
# hand with an earlier tag (docs/runbook.md).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (an earlier one rolls back)
        required: true
concurrency: { group: deploy, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      DATA: ${{ github.workspace }}/release/data
      SITE: ${{ github.workspace }}/site
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.TAG }}" }
      - name: Download the release's data
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: |
          gh release download "$TAG" --pattern 'wend-data-*.zip' --dir release
          unzip -q release/wend-data-*.zip -d release
          echo "DATA_VERSION=$(jq -er .data_version "$DATA/index.json")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - name: Stage the site
        run: node web/stage.ts "$DATA" "$SITE"
      - name: The staged page has no test hooks
        run: "! grep -rq wendGraph \"$SITE\""
      - name: Check the staged site
        run: npx vitest run tests/stage.test.ts
        working-directory: web
        env: { WEND_DATA: "${{ env.DATA }}", WEND_SITE: "${{ env.SITE }}" }
      - name: Deploy
        run: npx wrangler deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
      - name: Live check
        # A new deploy can take a short time to answer everywhere, so the check gets six tries a
        # minute apart; it fails the workflow if the last one fails.
        run: |
          for try in 1 2 3 4 5 6; do
            node web/live-check.ts https://wendtheword.flying-ant.uk "$DATA_VERSION" && exit 0
            [ "$try" = 6 ] || sleep 60
          done
          exit 1
