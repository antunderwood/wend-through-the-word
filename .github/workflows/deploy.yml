name: Deploy
# Deploys a release to wendtheword.flying-ant.uk (decisions 152, 153, 154): the release's data
# asset, staged with the page built from the release tag, checked, deployed, then checked live.
# It starts when the release command publishes the release (decision 158), after the zip is
# uploaded (the tag is pushed before, so a tag trigger could start before the zip exists). To roll
# back, run it by hand with an earlier tag (docs/runbook.md).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (an earlier one rolls back)
        required: true
concurrency: { group: deploy, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      DATA: ${{ github.workspace }}/release/data
      SITE: ${{ github.workspace }}/site
    steps:
      # Actions are pinned to a commit, so a moved tag cannot change what runs (decision 160).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: "${{ env.TAG }}", persist-credentials: false }
      - name: Download the release's data
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: |
          gh release download "$TAG" --pattern 'wend-data-*.zip' --dir release
          unzip -q release/wend-data-*.zip -d release
          # The version comes from the release asset, so check its form before it reaches the env.
          version=$(jq -er .data_version "$DATA/index.json")
          [[ "$version" =~ ^[0-9][0-9-]*$ ]] || { echo "Bad data version: $version"; exit 1; }
          echo "DATA_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      # The map's Esri access token is built into the page (decision 199). Without it the page would
      # fall back to OpenStreetMap's tile server, so a missing secret fails the deploy instead.
      - name: Stage the site
        run: |
          [ -n "$VITE_ESRI_TOKEN" ] || { echo "The ESRI_TOKEN secret is empty or missing: set it with gh secret set ESRI_TOKEN (docs/runbook.md)."; exit 1; }
          node web/stage.ts "$DATA" "$SITE"
        env: { VITE_ESRI_TOKEN: "${{ secrets.ESRI_TOKEN }}" }
      - name: The staged page has no test hooks
        run: "! grep -rq wendGraph \"$SITE\""
      - name: Check the staged site
        run: npx vitest run tests/stage.test.ts
        working-directory: web
        env: { WEND_DATA: "${{ env.DATA }}", WEND_SITE: "${{ env.SITE }}" }
      - name: Deploy
        run: npx wrangler deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
      - name: Live check
        # A new deploy can take a short time to answer everywhere, so the check gets six tries a
        # minute apart; it fails the workflow if the last one fails.
        run: |
          for try in 1 2 3 4 5 6; do
            node web/live-check.ts https://wendtheword.flying-ant.uk "$DATA_VERSION" --email \
              && exit 0
            [ "$try" = 6 ] || sleep 60
          done
          exit 1
