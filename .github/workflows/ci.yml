name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
  web:
    runs-on: ubuntu-latest
    env:
      WEND_DATA: ${{ github.workspace }}/.fixture-export/data
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build the fixture export
        run: >
          uv run python -c "import sys; sys.path.insert(0, 'tests'); from pathlib import Path;
          from conftest import run_build; run_build(Path(sys.argv[1]))" "$GITHUB_WORKSPACE/.fixture-export"
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npx playwright install --with-deps --only-shell chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-traces, path: web/test-results }
